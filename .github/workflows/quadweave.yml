name: QUADWEAVE host verification
on:
  pull_request:
    paths: ['ports/quadweave/**', 'wrapper/vst2_abi.h', '.github/workflows/quadweave.yml']
  push:
    branches: [main]
    paths: ['ports/quadweave/**', 'wrapper/vst2_abi.h', '.github/workflows/quadweave.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: python -m pip install pillow
      - run: ports/quadweave/test.sh
      - run: ports/quadweave/build.sh --host
      - run: python3 tools/studio.py preview 'ports/quadweave/build/skin/MPC-MOD - VST - QUADWEAVE/Plugin Skins' -o ports/quadweave/build/page_%d.png
